[project]
name = "medical-image-qc-pipeline"
version = "0.1.0"
description = "Image-centric medical dataset quality control and annotation review pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imagehash>=4.3.2,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
    "openpyxl>=3.1.5",
    "pandas>=2.2,<3",
    "pandera>=0.20,<0.28",
    "pillow>=10.4,<13",
    "pyyaml>=6.0,<7",
    "scikit-image>=0.24,<1",
    "scikit-learn>=1.5,<2",
    "tqdm>=4.66,<5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29,<7",
    "jupyter>=1.1,<2",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]
